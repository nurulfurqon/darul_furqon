# fly.toml app configuration file generated for darul-furqon

app = "darul-furqon-fe"
primary_region = "sin"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[statics]]
  guest_path = "/usr/share/nginx/html"
  url_prefix = "/"
